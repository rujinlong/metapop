name: metapop_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ==========================================================================
  # Core Python
  # ==========================================================================
  - python=3.12
  - pip

  # ==========================================================================
  # Bioinformatics Tools
  # ==========================================================================
  - samtools>=1.9
  - bcftools
  - pyrodigal          # Multi-threaded gene prediction (replaces prodigal)

  # ==========================================================================
  # Python Dependencies (for bin/ scripts)
  # ==========================================================================
  - pysam              # BAM file processing
  - numpy              # Numeric operations

  # ==========================================================================
  # R Core and Packages (Optional - only needed for visualization scripts)
  # ==========================================================================
  # Uncomment these if using the original R visualization scripts:
  - r-base
  - r-doparallel
  - r-data.table
  - r-stringr
  - r-ggplot2
  - r-ggrepel
  - r-cowplot
  - r-vegan
  - r-pheatmap
  - r-rcolorbrewer
  - r-bit64
  - r-gggenes
